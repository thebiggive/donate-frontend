<biggive-text-input [spaceBelow]="spaceBelow" [backgroundColour]="backgroundColour">
  <label slot="label" [for]="id">{{ label }}</label>
  <div slot="input" style="display: flex">
    <div class="visually-hidden" aria-live="polite">
      {{ showPassword() ? "Your password is shown" : "Your password is hidden" }}
    </div>
    <input
      matInput
      [type]="showPassword() ? 'text' : 'password'"
      [id]="id"
      [value]="value"
      [disabled]="disabled"
      [attr.autocomplete]="autocomplete"
      (input)="onInput($event)"
      (blur)="onBlur()"
    />
    <biggive-button
      role="button"
      tabindex="0"
      [attr.aria-controls]="id"
      colourScheme="clear-primary"
      (doButtonClick)="toggleShowPassword()"
      [label]="showPassword() ? 'Hide' : 'Show'"
      [spaceBelow]="0"
    />
  </div>
</biggive-text-input>
